# PURPOSE: 本 bundle 的 Loader 补丁**模板** —— 往 profile 插一行 Host 插件。安装由部署侧生成器/安装器完成，⛔ 不手改 profile。
# ORIGIN: 部署 profile 的 goal-observer 条目（2026-11-13 读码）；私有值（发送器路径、聊天 ID、话题）全部移除
# CUMULATIVE-DELTA: 首版。出厂 enabled: false（安装后必须显式改 true 才接管）；通知出厂关闭；
#   只插入自己的行，⛔ 不覆盖任何出货行（覆盖会把那一行的 config 整份替换）。
- insert:
    - id: goal-observer
      name: '@autoresearch/dsh-goal-observer'
      config:
        # 必须显式 true；缺省 / false / "true" 都按关闭处理（不注册监听器、不调用模型）。
        enabled: false
        # 只接管 objective 以此开头的 goal；普通 goal 一律不介入。
