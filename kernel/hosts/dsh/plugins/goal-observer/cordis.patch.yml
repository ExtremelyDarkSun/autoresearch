        # 两次观察调用共用这一个超时；100..300000。
        timeoutMs: 60000
        # thinking 与正文共用预算，实测偏小会 max-tokens；256..16000。
        maxTokens: 1800
        # 历史输入上限；2000..200000。
        contextChars: 24000
