      name: '@autoresearch/dsh-doc-gap'
      config:
        # ⚠️ 出厂 false。改成 true 之前先确认 docs 与 policy 都已填好。
        enabled: false
        threshold: 0.8
        # hint = 回合末尾提一句；ask = 让会话去 ask_user_question
