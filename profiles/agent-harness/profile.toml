# PURPOSE: 「被优化的对象是一个 agent harness」这个场景的评测接口配置：默认不带评测命令，只声明题单 / 结果 / 轨迹 / 预算的形状
# ORIGIN: none（新文件）。字段面抽取自上游组件 run_eval.py 的 DEFAULTS 与 eval_settings 映射，
#         以及 gates/gate_tasklist.py · gates/gate_out_of_workspace.py · gates/gate_leak.py 的可配置判据；不含任何一场比赛的数据与固定值
# CUMULATIVE-DELTA: 首版。command 为空且 configured=false ⇒ 默认不发起任何真评测。

# ---------------------------------------------------------------------------
# 顶层
# ---------------------------------------------------------------------------
# 这三个键由内核校验，值固定（见 kernel/autoresearch/profiles.py）。
id = "agent-harness"
version = 1

# 人读说明。⛔ 不要把具体比赛名、指定模型、真实题号、gold 内容、历史读数写进来：
# 这个文件是**通用配置**，不是某一场比赛的记录。
name = "目标 agent harness 评测配置（通用）"
description = """
把「被优化的对象是一个 agent harness」这一层单独写清楚：
题单是什么形状、结果落到哪、轨迹长什么样、预算怎么表达。
harness 内部的 prompt / 工具白名单 / 采样参数不在本配置里 —— 那些是被优化的**目标**，
放在被测仓库自己的配置里。
"""

# ---------------------------------------------------------------------------
# 评测入口
# ---------------------------------------------------------------------------
[evaluation]
# 评测命令模板：argv 数组（不是字符串），内核只做占位符替换，**不经过 shell**。
# 只允许两个占位符：
#   {tasks}  —— 题单文件路径
#   {output} —— 结果输出目录（结果文件与轨迹目录都落在它下面）
# 示例形状（⚠️ 只是形状说明，不是可执行命令；真实命令由部署方填写）：
#     command = ["<你的评测入口>", "--tasks", "{tasks}", "--out", "{output}"]
command = []

# false = 没有配置评测命令 ⇒ 内核的 build_command() 会报错，不会发起任何真评测。
# 想让 harness 真的跑起来，必须同时做三件事：写 command、置 configured=true、
# 在 [limits] 里给出必需的预算。三件事缺一行都不放行。
configured = false

# 结果文件（相对 --output 目录）。中性 JSONL，每行一道题，schema 见 schemas/results.schema.json。
result_file = "task_results.jsonl"

# 轨迹目录（相对 --output 目录）。schema 见 schemas/trace.schema.json。
trace_dir = "traces"

# 结果行 schema 的版本号。对比两次读数时它会进测量配置指纹。
result_schema_version = 1

# ---------------------------------------------------------------------------
# 必读清单
# ---------------------------------------------------------------------------
[instructions]
# 相对本 profile 目录的必读文件。读取义务由上层集成方合并、由宿主记录；
# 内核只给出路径，不判断「读到没有」。
required = ["RULES.md"]

# ---------------------------------------------------------------------------
# 预算（只用通用名）
# ---------------------------------------------------------------------------
[limits]
# 本仓库只认这五个通用预算名；写别的键会被 validate_profile() 判错 ——
# 这是为了不让某一场比赛的私有字段名或官方固定值混进通用配置。
#
#   per_task_minutes         —— 每题墙钟上限（分钟）
#   max_tool_calls           —— 每题工具调用次数上限
#   max_turns                —— 每题对话轮次上限
#   command_timeout_seconds  —— 单条命令的超时（秒）
#   total_budget_minutes     —— 整批总预算（分钟）；不填表示不设整批上限
#
# 语义（保持「时间 / 工具 / 轮次」三件正交，不要合并成一个数）：
#   · 时间与轮次管「这一题能持续多久、能来回多少趟」；
#   · 工具次数管「能对外部世界做多少次动作」；
#   · 单命令超时管「单个动作能跑多久」。
# 所有值都必须由部署方显式给出：本文件**不预填任何数值**，
# 也不提供隐藏默认值 —— 内核的 limit_for() 未配置就返回 None。

# ---------------------------------------------------------------------------
# 轨迹检查（可配置；全空 = 不检查，不是「干净」）
# ---------------------------------------------------------------------------
[trace]
# 轨迹里允许出现的工具名。空数组 = 不校验工具名。
# 填了之后，轨迹里出现白名单外的工具名会被标成 unknown_tool：
# 那说明实际工具面与你以为的不同，这条读数要打问号。
tool_names = []

# 工具归类（可选，供将来的分析用；空 = 不归类）。
# 例（形状说明，不是本仓库的真实工具名）：read_tools = ["<读文件的工具名>"]
read_tools = []
edit_tools = []
command_tools = []

# ---------------------------------------------------------------------------
# 工作区边界（可配置；全空 = 不检查）
# ---------------------------------------------------------------------------
[workspace]
# 允许 agent 活动的根目录（绝对路径）。空数组 = 不做越界判定。
# 相对路径不判（无法确定展开位置）；以 ~ 开头的路径也不判。
allowed_roots = []

# 命中即算越界的路径模式：字面前缀，或 "re:" 开头的正则。
# 用来点掉「工作区之外的参考材料 / 答案目录 / 系统包目录」。
forbidden_path_patterns = []

# 明确忽略的路径前缀（例如 harness 自己的临时目录）。只影响判定，不改轨迹。
ignore_paths = []

# ---------------------------------------------------------------------------
# 泄漏检查（可配置；全空 = 不检查）
# ---------------------------------------------------------------------------
[leak]
# 敏感片段（字面子串）：参考补丁的独有行、隐藏测试名、答案文件路径、内部代号……
# 由部署方填入。本文件不预填任何一段真实内容。
sensitive_fragments = []

# 是否连工具返回内容一起搜：false 只判「agent 发出的动作」，
# true 才判「真的读到了」。默认 false 是为了避免把 pytest 回显误判成泄漏。
include_observations = false

# ---------------------------------------------------------------------------
# schema 与示例的位置（相对本 profile 目录；由内核校验存在性）
# ---------------------------------------------------------------------------
[schema]
tasklist = "schemas/tasklist.schema.json"
results = "schemas/results.schema.json"
trace = "schemas/trace.schema.json"
tasklist_example = "examples/tasklist.example.jsonl"
results_example = "examples/results.example.jsonl"
trace_example = "examples/trace.example.json"
